name: Android CLI skills verification
on:
  pull_request:
  push:
    branches: [main, 'integration/**', 'stack/**', 'feature/probe-evidence-handoff-v1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install verified standalone Android CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/etroute-cli"
          curl --fail --location --retry 3 --max-time 120 \
            https://dl.google.com/android/cli/latest/linux_x86_64/android-cli \
            --output "$RUNNER_TEMP/etroute-cli/android"
          echo "9803784ddf24d4699929eece519ffa8b066afa9a2b93bd58749b3c6d2caaeeec  $RUNNER_TEMP/etroute-cli/android" | sha256sum --check
          chmod +x "$RUNNER_TEMP/etroute-cli/android"
          "$RUNNER_TEMP/etroute-cli/android" --no-metrics --version
          echo "$RUNNER_TEMP/etroute-cli" >> "$GITHUB_PATH"
      - name: Initialize and verify focused project skills
        shell: bash
        run: |
          set -euo pipefail
          android --no-metrics init
          for skill in android-cli adaptive jetpack-compose-performance; do
            android --no-metrics skills add "$skill" --agent=codex --project="$GITHUB_WORKSPACE"
            test -s ".agents/skills/$skill/SKILL.md"
          done
          android --no-metrics skills list --project="$GITHUB_WORKSPACE"
          find .agents/skills -type f -print0 | sort -z | xargs -0 sha256sum > android-skills-sha256.txt
          echo "ANDROID_CLI_SKILLS_READY=true" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v5
        with:
          name: android-agent-skills
          path: |
            .agents/skills/
            android-skills-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
