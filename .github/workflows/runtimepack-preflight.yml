name: RuntimePack preflight checks
on:
  pull_request:
    paths: ['android/**', '.github/workflows/runtimepack-preflight.yml']
  push:
    branches: [main, feature/runtimepack-preflight-v1]
    paths: ['android/**', '.github/workflows/runtimepack-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
      - name: Compile Android modules and JNI
        run: ETROUTE_BUILD_ONLY=1 bash tools/run_android_jni_validation.sh
      - name: Run JVM preflight rejection tests
        run: ./gradlew --no-daemon --console=plain :android:testDebugUnitTest
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: runtimepack-preflight-results
          path: |
            android/build/reports/tests/testDebugUnitTest
            android/build/test-results/testDebugUnitTest
          if-no-files-found: warn
